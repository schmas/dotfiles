# Centralize all worktrees under one repo-namespaced base, matching the
# per-repo base configured for Supacode (~/workspaces/<repo>/...).
worktree-path = "~/workspaces/{{ repo }}/{{ branch | sanitize }}"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[pre-switch]
sync-agent-up = "wt-sync-agent-files {{ worktree_path }} {{ primary_worktree_path }}"

[[pre-remove]]
protect-main-develop = """
case {{ branch }} in
  main|develop)
    echo "Error: Cannot remove protected branch '{{ branch }}'"
    exit 1
    ;;
esac
"""

[[pre-remove]]
sync-agent-files = "wt-sync-agent-files {{ worktree_path }} {{ primary_worktree_path }}"

[post-switch]
sync-agent-down = "wt-sync-agent-files {{ primary_worktree_path }} {{ worktree_path }}"

[post-start]
copy = "wt step copy-ignored"
# Packs (private chezmoi instances) add post-start hooks as executables in
# ~/.config/worktrunk/post-start.d/. Each one gets: <primary_worktree> <worktree>.
# All of them run; the hook fails and names each one that failed.
drop-ins = 'rc=0; for h in ~/.config/worktrunk/post-start.d/*; do if [ -x "$h" ]; then "$h" {{ primary_worktree_path }} {{ worktree_path }} || { echo "post-start.d: $h failed" >&2; rc=1; }; fi; done; exit $rc'
