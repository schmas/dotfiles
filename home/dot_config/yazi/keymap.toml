# --- Manager keybindings ---

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on   = [ "c", "p" ]
run  = "copy path"
desc = "Copy full path of hovered/selected item"

[[mgr.prepend_keymap]]
on   = [ "t", "t" ]
run  = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "2"
run  = "plugin smart-switch 1"
desc = "Switch or create tab 2"

[[mgr.prepend_keymap]]
on   = "3"
run  = "plugin smart-switch 2"
desc = "Switch or create tab 3"

[[mgr.prepend_keymap]]
on   = "4"
run  = "plugin smart-switch 3"
desc = "Switch or create tab 4"

[[mgr.prepend_keymap]]
on   = "5"
run  = "plugin smart-switch 4"
desc = "Switch or create tab 5"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "cd to git repo root"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "shell -- qlmanage -p %s"
desc = "Preview with macOS Quick Look"

[[mgr.prepend_keymap]]
on   = "K"
run  = "plugin parent-arrow -1"
desc = "Navigate parent directory up"

[[mgr.prepend_keymap]]
on   = "J"
run  = "plugin parent-arrow 1"
desc = "Navigate parent directory down"

[[mgr.prepend_keymap]]
on   = "q"
run  = "plugin confirm-quit"
desc = "Confirm quit if multiple tabs"

[[mgr.prepend_keymap]]
on   = "?"
run  = "plugin keybinds-help"
desc = "Show keybindings help"

[[mgr.prepend_keymap]]
on   = "<C-f>"
run  = "shell --block '~/.local/bin/yazi-find-file'"
desc = "Fuzzy find files globally (Ctrl-F)"

# --- Input keybindings ---

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
