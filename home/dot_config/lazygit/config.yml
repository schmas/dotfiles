git:
  pagers:
    - colorArg: always
      pager: diff-so-fancy
customCommands:
  - key: <c-g>
    description: Pick AI commit
    command: aicommit2 --clipboard
    context: files
    output: terminal
  - key: <c-n>
    description: Pick AI commit (no verify)
    command: aicommit2 --no-verify --clipboard
    context: files
    output: terminal
gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
  authorColors:
    '*': '#b4befe'
