# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

# Inserts a blank line between shell prompts
add_newline = true

# A minimal left prompt
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$shell\
${custom.zmx_session}\
$all\
$character
"""

right_format = """$status$cmd_duration$time"""

palette = "mine"

[palettes.mine]
#rosewater = "#f4dbd6"
#flamingo = "#f0c6c6"
#pink = "#f5bde6"
#mauve = "#c6a0f6"
#red = "#ed8796"
#maroon = "#ee99a0"
#peach = "#f5a97f"
yellow = "#D0B03B"
green = "#78C73B"
#teal = "#8bd5ca"
#sky = "#91d7e3"
#sapphire = "#7dc4e4"
blue = "#4EADF8"
#lavender = "#b7bdf8"
#text = "#cad3f5"
#subtext1 = "#b8c0e0"
#subtext0 = "#a5adcb"
#overlay2 = "#939ab7"
#overlay1 = "#8087a2"
#overlay0 = "#6e738d"
#surface2 = "#5b6078"
#surface1 = "#494d64"
#surface0 = "#363a4f"
#base = "#24273a"
#mantle = "#1e2030"
#crust = "#181926"
magenta = "#FF00FF"

[fill]
style = "black dimmed"
symbol = " "

[time]
disabled = false
time_format = "%R"          # Hour:Minute Format
style = "#678687"
format = '[$time]($style) '

[aws]
symbol = "  "
disabled = true

[gcloud]
disabled = true

[buf]
symbol = " "

[c]
symbol = " "

[cmd_duration]
format = '⧖ [$duration]($style) '

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
style = "bold blue"
truncation_length = 5
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
truncate_to_repo = false
before_repo_root_style = "bold blue dimmed"
repo_root_style = "bold blue"

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "
style = "green"

[git_status]
#stashed = "*"
#format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
ahead = '⇡${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '+${count}'
modified = '!${count}'
untracked = '?${count}'

[golang]
format = '[$symbol($version )]($style)'
version_format = '${raw}'
symbol = " "

[haskell]
symbol = " "

[hg_branch]
symbol = " "

[java]
format = '[${symbol} (${version} )]($style)'
version_format = '${raw}'
symbol = ""

[julia]
symbol = " "

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
format = '[$symbol($version )]($style)'
version_format = '${raw}'
symbol = " "

[package]
disabled = true
symbol = " "

[python]
format = '[$symbol($version )]($style)'
version_format = '${raw}'
symbol = " "

[spack]
symbol = "🅢 "

[status]
disabled = false
format = '[\[$symbol$status\]]($style) '
symbol = ""

[shell]
fish_indicator = '󰈺 '
powershell_indicator = '_'
unknown_indicator = 'mystery shell'
style = 'cyan bold'
disabled = false

#[sudo]
#disabled = false

[rust]
format = '[$symbol($version )]($style)'
version_format = '${raw}'
#symbol = " "
symbol = "🦀 "

[zig]
symbol = " "

# zmx session name (supacode = uuid): keep last 4, fill front up to 24 chars (first + … + last4)
[custom.zmx_session]
when = 'test -n "$ZMX_SESSION"'
command = '''printf '%s' "$ZMX_SESSION" | awk '{ max=24; tail=4; if (length($0) > max) printf "%s…%s", substr($0,1,max-tail-1), substr($0, length($0)-tail+1); else printf "%s", $0 }' '''
symbol = " "
format = "[$symbol$output]($style) "
description = "zmx session name"
style = "bold magenta"