[metadata]
name = "dirs"
description = "A channel to select from directories"
requirements = ["fd"]

[source]
command = ["fd -t d", "fd -t d --hidden"]

[preview]
command = "ls -la --color=always '{}'"

[keybindings]
shortcut = "f2"

[actions.cd]
description = "Open a shell in the selected directory"
command = "cd '{}' && $SHELL"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv dirs .."
mode = "execute"

[actions.copy_relative_path]
description = "Copy relative path to clipboard"
command = '''echo -n '{}' | pbcopy && echo "Relative path copied: {}"'''
shell = "bash"
mode = "fork"

[actions.copy_absolute_path]
description = "Copy absolute path to clipboard"
command = '''echo -n "$(cd '{}' && pwd)" | pbcopy && echo "Absolute path copied: $(cd '{}' && pwd)"'''
shell = "bash"
mode = "fork"
