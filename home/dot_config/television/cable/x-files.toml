[metadata]
name = "x-files"
description = "Files (fd) — adds copy relative/absolute path actions (custom)"
requirements = ["fd", "bat"]

[source]
# Modern named sources (Default / Hidden), per current upstream `files`.
command = [
  { name = "Default", run = "fd -t f" },
  { name = "Hidden",  run = "fd -t f -H" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

# No `shortcut` here: the official `files` channel owns F1; this custom variant
# is invoked by name (`tv x-files`).
[keybindings]
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} {}"
shell = "bash"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv x-files .."
mode = "execute"

# Custom: copy paths to the clipboard.
[actions.copy_relative_path]
description = "Copy relative path to clipboard"
command = '''echo -n '{}' | pbcopy && echo "Relative path copied: {}"'''
shell = "bash"
mode = "fork"

[actions.copy_absolute_path]
description = "Copy absolute path to clipboard"
command = '''echo -n "$(cd "$(dirname '{}')" && pwd)/$(basename '{}')" | pbcopy && echo "Absolute path copied: $(cd "$(dirname '{}')" && pwd)/$(basename '{}')"'''
shell = "bash"
mode = "fork"
