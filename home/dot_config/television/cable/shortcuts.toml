[metadata]
name = "shortcuts"
description = "Fuzzy-search the keybinding cheatsheet (SHORTCUTS-REFERENCE.md)"
requirements = ["awk"]

[source]
# Parse markdown tables into aligned, colored "Section | Key | Action" columns.
# Unicode arrows are normalized to words so printf byte-width matches display
# width (clean alignment). Single source of truth shared with the `shortcuts` CLI.
command = '''awk '/^## /{s=$0; sub(/^## /,"",s); next} /^\| / && $0 !~ /^\| *-/ {row=$0; sub(/^\| */,"",row); sub(/ *\| *$/,"",row); split(row,a,/ *\| */); k=a[1]; act=a[2]; gsub(/`/,"",k); gsub(/`/,"",act); gsub(/→/,"Right",k); gsub(/←/,"Left",k); gsub(/↑/,"Up",k); gsub(/↓/,"Down",k); if(k=="Key")next; n++; sec[n]=s; key[n]=k; desc[n]=act; if(length(s)>ws)ws=length(s); if(length(k)>wk)wk=length(k)} END{for(i=1;i<=n;i++) printf "\033[36m%-*s\033[0m  \033[32m%-*s\033[0m  %s\n", ws, sec[i], wk, key[i], desc[i]}' "$HOME/.local/share/chezmoi/SHORTCUTS-REFERENCE.md"'''
output = "{strip_ansi}"
ansi = true

[ui]
layout = "portrait"
