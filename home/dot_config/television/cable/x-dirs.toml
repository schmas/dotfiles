[metadata]
name = "x-dirs"
description = "Directories (fd) — adds copy relative/absolute path actions (custom)"
requirements = ["fd"]

[source]
# Modern named sources (Default / Hidden), per current upstream `dirs`.
command = [
  { name = "Default", run = "fd -t d" },
  { name = "Hidden",  run = "fd -t d --hidden" },
]

[preview]
command = "ls -la --color=always '{}'"

# No `shortcut` here: the official `dirs` channel owns F2; this custom variant
# is invoked by name (`tv x-dirs`).
[keybindings]
ctrl-up = "actions:goto_parent_dir"

[actions.cd]
description = "Open a shell in the selected directory"
command = "cd {} && $SHELL"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv x-dirs .."
mode = "execute"

# Custom: copy paths to the clipboard.
[actions.copy_relative_path]
description = "Copy relative path to clipboard"
command = '''echo -n '{}' | pbcopy && echo "Relative path copied: {}"'''
shell = "bash"
mode = "fork"

[actions.copy_absolute_path]
description = "Copy absolute path to clipboard"
command = '''echo -n "$(cd '{}' && pwd)" | pbcopy && echo "Absolute path copied: $(cd '{}' && pwd)"'''
shell = "bash"
mode = "fork"
